name: Import project and deploy preview
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source into main
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, shutil, subprocess, tempfile, zipfile
          z=glob.glob('*.zip')[0]
          with tempfile.TemporaryDirectory() as t:
              with zipfile.ZipFile(z) as archive: archive.extractall(t)
              root=os.path.join(t,os.listdir(t)[0])
              for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  if name.startswith('.github/') or name==z: continue
                  if os.path.isfile(name): os.remove(name)
              for name in os.listdir(root):
                  if name in ['node_modules','.astro','dist','.git']: continue
                  src=os.path.join(root,name)
                  if os.path.isdir(name): shutil.rmtree(name)
                  elif os.path.exists(name): os.remove(name)
                  shutil.move(src,name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import current site source' || true
          git push origin HEAD:main
      - name: Build preview
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          repo=os.environ['GITHUB_REPOSITORY'].split('/')[-1]
          p='astro.config.mjs'
          if os.path.isfile(p):
              s=open(p).read()
              s=re.sub(r"site: '[^']+'", "site: 'https://aintgottaclue.github.io'",s)
              s=s.replace("site: 'https://aintgottaclue.github.io',", "site: 'https://aintgottaclue.github.io',\n  base: '/"+repo+"/',")
              open(p,'w').write(s)
          PY
          if [ -f package.json ]; then npm ci --ignore-scripts && npm run build; else mkdir -p dist; find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name dist ! -name '*.zip' -exec cp -a {} dist/ \;; fi
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          base='/'+os.environ['GITHUB_REPOSITORY'].split('/')[-1]+'/'
          for p in Path('dist').rglob('*.html'):
              s=p.read_text()
              s=re.sub(r'(?<=href=")/(?!/|'+re.escape(base[1:])+r')',base,s)
              s=re.sub(r'(?<=src=")/(?!/|'+re.escape(base[1:])+r')',base,s)
              p.write_text(s)
          Path('dist/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
