name: Build and deploy preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build preview
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          repo=os.environ['GITHUB_REPOSITORY'].split('/')[-1]
          p='astro.config.mjs'
          if os.path.isfile(p):
              s=open(p).read()
              s=re.sub(r"site: '[^']+'", "site: 'https://aintgottaclue.github.io'",s)
              s=s.replace("site: 'https://aintgottaclue.github.io',", "site: 'https://aintgottaclue.github.io',\n  base: '/"+repo+"/',")
              open(p,'w').write(s)
          if repo=='Biz-Directory-POC':
              p='src/lib/router.tsx'
              s=open(p).read()
              s=s.replace("if (to !== '/' && !isCityContent(to)) return to;\n  return cityPath(cityForPath(currentPath).slug, to);", "const target = (to !== '/' && !isCityContent(to)) ? to : cityPath(cityForPath(currentPath).slug, to);\n  return '/Biz-Directory-POC' + target;")
              open(p,'w').write(s)
              p='src/components/Header.tsx'
              s=open(p).read().replace("window.location.assign(cityPath(e.target.value as typeof city.slug))", "window.location.assign('/Biz-Directory-POC' + cityPath(e.target.value as typeof city.slug))")
              open(p,'w').write(s)
              p='src/views/NotFound.tsx'
              s=open(p).read().replace('href="/"', 'href="/Biz-Directory-POC/"')
              open(p,'w').write(s)
          PY
          if [ -f package.json ]; then npm ci --ignore-scripts && npm run build; else mkdir -p dist; find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name dist ! -name '*.zip' -exec cp -a {} dist/ \;; fi
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          base='/'+os.environ['GITHUB_REPOSITORY'].split('/')[-1]+'/'
          for p in Path('dist').rglob('*.html'):
              s=p.read_text()
              s=re.sub(r'(?<=href=")/(?!/|'+re.escape(base[1:])+r')',base,s)
              s=re.sub(r'(?<=src=")/(?!/|'+re.escape(base[1:])+r')',base,s)
              p.write_text(s)
          Path('dist/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
